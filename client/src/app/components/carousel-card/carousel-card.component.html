<div class="carousel-item-content text-center">
  <img [src]="resource.imageURL" class="d-block w-100" alt="image">
  <div class="carousel-caption d-none d-md-block">
    <h5>{{ resource.name }}</h5>
    <p *ngIf="!resource['artists'] && resource['followersStr']">
      {{ resource['followersStr'] }} followers
    </p>
    <p *ngIf="resource['artists']">
      <ng-container *ngFor="let a of resource['artists']; let last = last">
        {{ a.name }}<span *ngIf="!last">, </span>
      </ng-container>
    </p>
  </div>
</div>
