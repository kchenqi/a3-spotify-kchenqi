<div *ngIf="resources" [id]="carouselId" class="carousel slide carousel-fade">
  <div class="carousel-inner">
    <div class="carousel-item" 
         *ngFor="let resource of resources; let first = first"
         [class.active]="first">
      <app-carousel-card [resource]="resource"></app-carousel-card>
    </div>
  </div>
  <a class="carousel-control-prev" 
     [attr.data-bs-target]="carouselIdForBinding" 
     data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </a>
  <a class="carousel-control-next" 
     [attr.data-bs-target]="carouselIdForBinding" 
     data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </a>
</div>
