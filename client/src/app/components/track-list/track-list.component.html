	<table class="table table-sm table-light table-striped" *ngIf="tracks?.length">
		<thead>
			<tr>
				<th scope="col">#</th>
				<th scope="col">Track</th>
				<th scope="col">Duration</th>
				<th scope="col" *ngIf="!hideArtist">Primary Artist</th>
				<th scope="col" *ngIf="!hideAlbum">Album</th>
			</tr>
		</thead>
		<tbody>
			<tr *ngFor="let track of tracks; let i = index">
				<td>{{ i + 1 }}</td>
				<td>
					<!--TODO: link to the endpoint for that track, display the track's name-->
					<a [routerLink]="['/track', track.id]">{{ track.name }}</a>
				</td>
				<!--TODO: display the track's duration-->
				<td>{{ track.durationStr }}</td>
				<td *ngIf="!hideArtist"><a [routerLink]="['/artist', track.artists[0].id]">{{ track.artists[0].name }}</a></td>
				<td *ngIf="!hideAlbum">
          <a [routerLink]="['/album', track.album.id]">{{ track.album.name }}</a></td>
			</tr>
		</tbody>
	</table>
